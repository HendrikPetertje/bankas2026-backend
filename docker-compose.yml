services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_URL: "ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db/${POSTGRES_DB:-bankas_2026_backend_prod}"
      PHX_HOST: "${PHX_HOST:-localhost}"
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - /app/bin/bankas_2026_backend eval "Bankas2026Backend.Release.migrate" && exec /app/bin/bankas_2026_backend start
    ports:
      - "4010:4000"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-bankas_2026_backend_prod}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bankas_2026_backend_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres:/var/lib/postgresql/data
